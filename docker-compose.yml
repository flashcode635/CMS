services:
  postgres:
    image: postgres:17
    container_name: study-palace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: study_palace_dev
      POSTGRES_DB: studypalace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studypalace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: